name: Developer examples (offline validation)
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline tests and syntax checks
        run: bash scripts/check-examples.sh
